<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Posts</title>


   <style>
      body {
         background-color: #f0f2f5;
         font-family: Helvetica, Arial, sans-serif;
      }


      form {
         min-height: 180px;
      }


      article, form {
         background-color: #ffffff;
         border-radius: 8px;
         box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
         padding: 12px 16px;
         margin-bottom: 16px;
         max-width: 680px;
         margin-left: auto;
         margin-right: auto;
      }


      h2 {
         color: #050505;
         font-size: 0.9375rem;
         font-weight: 600;
         margin: 0 0 4px 0;
      }


      p {
         color: #050505;
         font-size: 0.9375rem;
         line-height: 1.3333;
         margin: 8px 0 0 0;
      }
   </style>
</head>


<body>
<h1> Welcome to my Posts page! </h1>


   <form action="#">


       <label for="userID">Select User:</label>
       <select id="userID">
           <option value="">--Please choose an option--</option>
           <option value="1">User 1</option>
           <option value="2">User 2</option>
           <option value="3">User 3</option>
           <option value="4">User 4</option>
           <option value="5">User 5</option>
           <option value="6">User 6</option>
           <option value="7">User 7</option>
       </select>


       <button type="button" id="filterBtn">Filter</button>


       <br><br>


       <label for="displayUserID">Enter User ID:</label>
       <input type="number" id="displayUserID" min="1" max="10">


       <button type="button" id="displayUserBtn">Display User Posts</button>


       <br><br>


       <label for="postID">Enter Post ID:</label>
       <input type="number" id="postID" min="1" max="100">


       <button type="button" id="findBtn">Find</button>


   </form>


   <script>
       let data = [];


       const getInfo= async()=>{
           let api = await fetch('https://jsonplaceholder.typicode.com/posts');
           api = await api.json();
           try{
               for (let post in api) {
                   data.push(api[post]);
                   let article = document.createElement('article');
                   let h2 = document.createElement('h2');
                   let p = document.createElement('p');
                   let id = document.createElement('p');
                   let userid = document.createElement('p');
                   h2.textContent = data[post].title;
                   p.textContent = data[post].body;
                   id.textContent = `Post ID: ${data[post].id}`;
                   userid.textContent = `User ID: ${data[post].userId}`;
                   article.appendChild(h2);
                   article.appendChild(p);
                   article.appendChild(id);
                   article.appendChild(userid);
                   document.body.appendChild(article);


               }
           } catch(error) {
               console.error("Caught rejection: ", error.message);
           }
           console.table(data);
       }
       getInfo();
       filterBtn.addEventListener('click', () =>{
        const form = document.querySelector('form');
        const userID = form.querySelector('#userID').value;
        const filteredData = data.filter(function(post) {
         return post.userId === Number(userID);
        });
        console.table(filteredData);
       });
       const userBtn = document.querySelector('#displayUserBtn');
       const displayBtn = document.querySelector('#displayUserBtn');
       displayBtn.addEventListener('click', () => {
         const displayUserID = document.querySelector('#displayUserID');
         const filteredData = data.filter(function(post) {
           return post.userId === Number(displayUserID.value);
         });
         document.querySelectorAll('article').forEach(function(article){
            article.remove();
         });
         filteredData.forEach(function(post) {
           let article = document.createElement('article');
           let h2 = document.createElement('h2');
           let p = document.createElement('p');
           let id = document.createElement('p');
           let userid = document.createElement('p');
           h2.textContent = post.title;
           p.textContent = post.body;
           id.textContent = `Post ID: ${post.id}`;
           userid.textContent = `User ID: ${post.userId}`;
           article.appendChild(h2);
           article.appendChild(p);
           article.appendChild(id);
           article.appendChild(userid);
           document.body.appendChild(article);
         });
       });
       const postId = document.querySelector('#postID');
       const findBtn = document.querySelector('#findBtn');
       findBtn.addEventListener('click', () => {
         const filteredData = data.filter(function(post) {
           return post.id === Number(postID.value);
         });
         document.querySelectorAll('article').forEach(function(article){
            article.remove();
         });
         filteredData.forEach(function(post) {
           let article = document.createElement('article');
           let h2 = document.createElement('h2');
           let p = document.createElement('p');
           let id = document.createElement('p');
           let userid = document.createElement('p');
           h2.textContent = post.title;
           p.textContent = post.body;
           id.textContent = `Post ID: ${post.id}`;
           userid.textContent = `User ID: ${post.userId}`;
           article.appendChild(h2);
           article.appendChild(p);
           article.appendChild(id);
           article.appendChild(userid);
           document.body.appendChild(article);
         });
       });




   </script>


</body>
</html>
