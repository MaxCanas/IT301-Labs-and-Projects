<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>lab14</title>
</head>
<body>
  
  
   <script>
       let img = document.createElement('img');
       let bttn = document.createElement('button');
       bttn.type = 'button';
       bttn.textContent = 'New User';
       let form = document.createElement('form');
       form.action = '#';
       form.appendChild(bttn);
       document.body.appendChild(form);
       document.body.appendChild(img);
       let nameshow = document.createElement('p');
       document.body.appendChild(nameshow);
       let emailshow = document.createElement('p');
       document.body.appendChild(emailshow);
       let numbershow = document.createElement('p');
       document.body.appendChild(numbershow);

       const getUser= async()=>{
           let api = await fetch('https://randomuser.me/api/');
           api = await api.json();
           let pic = api.results[0].picture.large;
           img.src = pic;
           img.alt = "User picture";
           let name = api.results[0].name.first;
           nameshow.textContent = name;
           let email = api.results[0].email;
           emailshow.textContent = email;
           let phone = api.results[0].phone;
           numbershow.textContent = phone;
           img.style.width = '300px';
       }
       bttn.addEventListener('click', getUser);
   </script>
</body>
</html>
