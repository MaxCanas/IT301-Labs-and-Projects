<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>lab16</title>
   <style>
        .rule {
            display: none;
        }
   </style>
</head>
<body>
   <h1>Form Validation!!!!!!!1</h1>
   <form action="#">
       <label for="enter">Name:</label>
       <input type="text" id="name" placeholder="Enter name" required>
       <label for="enter">email:</label>
       <input type="email" id="email" placeholder="Enter email" required>
       <label for="enter">password:</label>
       <input type="password" id="password" placeholder="Enter password" required>
       <button id="submit">Submit</button>
       <div  class="rules" id="password-rules">
       <div id="rule-length" class="rule">✖ At least 6 characters</div>
       <div id="rule-special" class="rule">✖ Must include a special character (!@#$...)</div>
       <div id="rule-uppercase" class="rule">✖ Must include an uppercase letter (A-Z)</div>
       </div>
       <p id="carter"></p>
       <script>
           const submit = document.getElementById('submit');
           const carter = document.getElementById('carter');
           const password = document.getElementById('password');
           password.addEventListener('input', ()=>{
               const passwordVal = password.value;
               const length = document.getElementById('rule-length');
               const special = document.getElementById('rule-special');
               const uppercase = document.getElementById('rule-uppercase');

               const checkLength = passwordVal.length < 6;
               const checkSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(passwordVal);
               const checkUppercase = /[A-Z]/.test(passwordVal);

               length.classList.toggle('rule', !checkLength);
               special.classList.toggle('rule', checkSpecial);
               uppercase.classList.toggle('rule', checkUppercase);
           })
           submit.addEventListener('click', (event)=>{
               event.preventDefault();
               const name = document.getElementById('name').value;
               const email = document.getElementById('email').value;
               const password = document.getElementById('password').value;
               if (name == "" || email == "" || password == "") {
                   carter.textContent = "Form incomplete, please fill all boxes";
               } else {
                   carter.textContent = "Form submitted successfully";
               };
           });
       </script>


   </form>
</body>
</html>
